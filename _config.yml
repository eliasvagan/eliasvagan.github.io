title: Elias Vagan
description: Personal site and small web tools, as well as a live version of Celestial Alliance
url: https://eliasvagan.github.io

gems:
  - jekyll-sitemap

exclude:
  - .git
  - .gitignore
  - README.md
  - .idea
  - test
  - projects/README.md
  # Setting `exclude` replaces Jekyll's defaults, so the build tooling has to be named here or it ships.
  - node_modules
  - package.json
  - package-lock.json
  - projects.json
  - scripts
